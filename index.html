  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .view-more-reviews-button {
      transition: transform 220ms ease, border-color 220ms ease, background-color 220ms ease, color 220ms ease, box-shadow 220ms ease;
    }

    .view-more-reviews-button:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #F97316;
      background: #F97316;
      color: #fff;
      box-shadow: 0 18px 35px -14px rgba(249, 115, 22, 0.75);
    }

    .view-more-reviews-button:active {
      transform: translateY(0) scale(0.99);
      box-shadow: 0 10px 22px -16px rgba(249, 115, 22, 0.65);
    }

    .view-more-reviews-button svg {
      transition: transform 220ms ease;
    }

    .view-more-reviews-button:hover svg {
      transform: translateX(4px);
    }

    /* Global Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Specific Best Seller Scrollbar */
    .best-seller-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .best-seller-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      /* Slate-100 */
      border-radius: 3px;
      margin-left: 16px;
      /* matches px-4 (mobile left padding of carousel) */
      margin-right: 0;
    }

    @media (min-width: 768px) {
      .best-seller-scroll::-webkit-scrollbar-track {
        margin-left: 10vw;
        /* matches md:px-[10vw] */
      }
    }

    .best-seller-scroll::-webkit-scrollbar-thumb {
      background: #1e293b;
      /* Brand dark */
      border-radius: 3px;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* Mobile-friendly visible horizontal scrollbar (comparison table) */
    .comparison-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-gutter: stable;
    }

    @media (max-width: 767px) {
      .comparison-scroll::-webkit-scrollbar {
        height: 10px;
      }
      .comparison-scroll::-webkit-scrollbar-track {
        background: #f1f5f9; /* slate-100 */
        border-radius: 9999px;
        margin: 16px 20px; /* align with px-5 container */
      }
      .comparison-scroll::-webkit-scrollbar-thumb {
        background: #0f172a; /* brand dark-ish */
        border-radius: 9999px;
      }
    }

    .fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes marquee {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .animate-marquee {
      animation: marquee 20s linear infinite;
      will-change: transform;
    }

    @keyframes running-dash {
      to {
        stroke-dashoffset: -10;
      }
    }

    .animate-running-dash {
      animation: running-dash 0.5s linear infinite;
    }

    @keyframes bar-stripe-run {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: 11.31px 0;
      }
    }

    .animate-bar-stripe-run {
      animation: bar-stripe-run 0.6s linear infinite;
      will-change: background-position;
    }

    @keyframes shine {
      0% {
        left: -100%;
        opacity: 0;
      }

      50% {
        opacity: 0.5;
      }

      100% {
        left: 200%;
        opacity: 0;
      }
    }

    .animate-shine {
      animation: shine 4s infinite linear;
    }

    @keyframes pulse-urgent {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      50% {
        transform: scale(1.03);
        box-shadow: 0 20px 30px -5px rgba(255, 87, 34, 0.2), 0 10px 10px -5px rgba(255, 87, 34, 0.1);
        border-color: rgba(255, 87, 34, 0.4);
      }
    }

    .animate-urgent {
      animation: pulse-urgent 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      will-change: transform, box-shadow;
    }

    @keyframes selling-fast-pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0));
      }

      50% {
        opacity: 0.95;
        transform: scale(1.02);
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.5));
      }
    }

    .animate-selling-fast {
      animation: selling-fast-pulse 1.2s ease-in-out infinite;
    }

    @keyframes glow-pulse {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 0.85;
        transform: scale(1.04);
      }
    }

    .animate-glow-pulse {
      animation: glow-pulse 2.5s ease-in-out infinite;
    }
  </style>
